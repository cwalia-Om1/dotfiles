onboarding = false
# herdr config -- overrides only; anything omitted uses herdr's defaults.
# Full annotated reference: `herdr --default-config`
# Apply changes to a running server: `herdr server reload-config` (or prefix+shift+r)

[ui]
# Agent panel ordering: "spaces" (grouped by space) or "priority" (blocked-first attention queue).
agent_panel_sort = "spaces"

# ---------------------------------------------------------------------------
# Agent presets via the om1incubator/herdr-presets plugin (installed by setup;
# presets tracked in dotfiles/herdr/agents.json, `ha` in ~/.local/bin).
# prefix+a opens a picker; prefix+shift+a the same picker into a new space;
# the rest start a favourite next to the focused pane.
# ---------------------------------------------------------------------------
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "om1incubator.herdr-presets.pick"
description = "start an agent from a preset"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "om1incubator.herdr-presets.pick-space"
description = "start agents from presets in a new space"

[[keys.command]]
key = "prefix+alt+c"
type = "shell"
command = "\"$HOME/.local/bin/ha\" claude"
description = "start claude (Claude Code on Teams)"

# Toggle a lazygit pane for the focused pane's repo (bin/herdr-changes); q also closes it.
[[keys.command]]
key = "prefix+alt+g"
type = "shell"
command = "\"$HOME/.local/bin/herdr-changes\""
description = "toggle changed-files pane (lazygit)"

# Docker workspace: view (lazydocker), manage (docker-manage), usage (bin/herdr-docker).
[[keys.command]]
key = "prefix+alt+d"
type = "shell"
command = "\"$HOME/.local/bin/herdr-docker\""
description = "open docker workspace"

# Use the terminal's own colors, so the terminal background shows through.
[theme]
name = "terminal"

# Claude rows: title (spinner while working) and name, red while waiting on you (~/.claude/hooks/herdr-attention.sh).
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title"],
  [{ token = "$name_ok" }, { token = "$name_alert", fg = "#ff5555", bold = true }],
]

[ui.sound]
enabled = false
